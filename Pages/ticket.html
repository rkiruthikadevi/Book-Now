<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Ticket</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#08122d;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:400px;
background:white;
padding:20px;
border-radius:20px;
text-align:center;
}

h2{
margin-bottom:20px;
color:#08122d;
}

.ticket{
background:#f5f5f5;
padding:15px;
border-radius:10px;
text-align:left;
}

.ticket p{
margin:8px 0;
}

.qr{
text-align:center;
margin-top:20px;
}

.qr img{
width:150px;
}

.btn{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.download{
background:#57d2b3;
}

.print{
background:#08122d;
color:white;
}

</style>
</head>
<body>

<div class="container">

<h2>E-Ticket</h2>

<div class="ticket">

<p><b>Ticket ID:</b> BK12345</p>



<p id="nameDisplay"></p>

<p id="ageDisplay"></p>

<p id="genderDisplay"></p>

<p id="transportDisplay"></p>

<p id="routeDisplay"></p>

<p id="seatDisplay"></p>

<p id="fareDisplay"></p>
</div>

<div class="qr">

<img
src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=BK12345"
alt="QR Code">

</div>
<button class="btn download"
onclick="window.print()">
Download Ticket
</button>



<button class="btn print" onclick="window.print()">
Print Ticket
</button>



</div>
<script>

document.getElementById("nameDisplay").innerHTML =
"<b>Passenger Name:</b> " +
(localStorage.getItem("passengerName") || "-");

document.getElementById("ageDisplay").innerHTML =
"<b>Age:</b> " +
(localStorage.getItem("passengerAge") || "-");

document.getElementById("genderDisplay").innerHTML =
"<b>Gender:</b> " +
(localStorage.getItem("passengerGender") || "-");

document.getElementById("transportDisplay").innerHTML =
"<b>Transport:</b> " +
(localStorage.getItem("transport") || "-");

document.getElementById("routeDisplay").innerHTML =
"<b>Route:</b> " +
(localStorage.getItem("route") || "-");

document.getElementById("seatDisplay").innerHTML =
"<b>Seat No:</b> " +
(localStorage.getItem("seatNumber") || "-");

document.getElementById("fareDisplay").innerHTML =
"<b>Fare:</b> ₹" +
(localStorage.getItem("totalPrice") || "0");

</script>

</body>
</html>
