<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#08122d;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:400px;
background:white;
border-radius:20px;
overflow:hidden;
}

.header{
background:#57d2b3;
padding:30px;
text-align:center;
}

.profile-pic{
width:100px;
height:100px;
border-radius:50%;
background:white;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
color:#08122d;
}

.name{
margin-top:15px;
font-size:22px;
font-weight:bold;
}

.email{
color:#444;
}

.menu{
padding:20px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
margin-bottom:10px;
background:#f5f5f5;
border-radius:10px;
cursor:pointer;
}

.item i{
color:#08122d;
}

.logout{
width:100%;
padding:15px;
border:none;
background:#08122d;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
border-radius:10px;
}

</style>
</head>
<body>

<div class="container">

<div class="header">

<div class="profile-pic">
<i class="fa-solid fa-user"></i>
</div>

<div class="name">
Kiruthika
</div>

<div class="email">
kiruthika@29.com
</div>

</div>

<div class="menu">

<a href="ticket.html" style="text-decoration:none;color:black;">
<div class="item">
<span>🎫 My Bookings</span>
<i class="fa-solid fa-angle-right"></i>
</div>
</a>

<a href="history.html" style="text-decoration:none;color:black;">
<div class="item">
<span>🕒 Journey History</span>
<i class="fa-solid fa-angle-right"></i>
</div>
</a>

<a href="wallet.html" style="text-decoration:none;color:black;">
<div class="item">
<span>💰 Wallet Balance</span>
<i class="fa-solid fa-angle-right"></i>
</div>
</a>

<a href="notification.html" style="text-decoration:none;color:black;">
<div class="item">
<span>🔔 Notifications</span>
<i class="fa-solid fa-angle-right"></i>
</div>
</a>

<a href="settings.html" style="text-decoration:none;color:black;">
<div class="item">
<span>⚙ Settings</span>
<i class="fa-solid fa-angle-right"></i>
</div>
</a>

<button class="logout"
onclick="window.location.href='../index.html'">
Logout
</button>

</div>

</div>

</body>
</html>
