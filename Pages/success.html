<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Success</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#08122d;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
border-radius:20px;
width:400px;
text-align:center;
}

.check{
font-size:80px;
color:green;
}

h2{
margin:20px 0;
}

.ticket{
background:#f5f5f5;
padding:15px;
border-radius:10px;
margin-top:20px;
text-align:left;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#57d2b3;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

</style>
</head>
<body>

<div class="container">

<div class="check">✅</div>

<h2>Booking Successful</h2>

<div class="ticket">

<p id="ticketId"></p>

<p id="routeDisplay"></p>

<p id="seatDisplay"></p>

<p id="transportDisplay"></p>

<p id="priceDisplay"></p>
<img
src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=BK12345"
alt="QR Code">

</div>

<button onclick="window.location.href='profile.html'">
View Profile
</button>

</div>
<script>

document.getElementById("routeDisplay").innerHTML =
"<b>Route:</b> " +
(localStorage.getItem("route") || "-");

document.getElementById("seatDisplay").innerHTML =
"<b>Seat No:</b> " +
(localStorage.getItem("seatNumber") || "-");

document.getElementById("transportDisplay").innerHTML =
"<b>Transport:</b> " +
(localStorage.getItem("transport") || "-");

document.getElementById("priceDisplay").innerHTML =
"<b>Amount:</b> ₹" +
(localStorage.getItem("totalPrice") || "0");
document.getElementById("ticketId").innerHTML =
"<b>Ticket ID:</b> BK" +
Math.floor(Math.random()*100000);

</script>
<script>

let booking = {
route: localStorage.getItem("route"),
seat: localStorage.getItem("seatNumber"),
transport: localStorage.getItem("transport"),
price: localStorage.getItem("totalPrice")
};

localStorage.setItem(
"lastBooking",
JSON.stringify(booking)
);
let history =
JSON.parse(localStorage.getItem("history")) || [];

history.push({

transport:
localStorage.getItem("transport"),

route:
localStorage.getItem("route"),

seat:
localStorage.getItem("seatNumber"),

price:
localStorage.getItem("totalPrice")

});

localStorage.setItem(
"history",
JSON.stringify(history)
);
</script>


</body>
</html>
