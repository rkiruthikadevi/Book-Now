<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#08122d;
display:flex;
justify-content:center;
}

.container{
width:400px;
background:white;
padding:20px;
border-radius:20px;
}

h2{
text-align:center;
margin-bottom:20px;
color:#08122d;
}

.route-box{
background:#57d2b3;
padding:15px;
border-radius:12px;
margin-bottom:20px;
}

.route-box input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
}

.transport{
display:flex;
justify-content:space-between;
margin-bottom:20px;
}

.transport div{
width:60px;
height:60px;
background:#08122d;
color:white;
display:flex;
justify-content:center;
align-items:center;
border-radius:10px;
font-size:25px;
cursor:pointer;
}

.ticket{
background:#f5f5f5;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.ticket h3{
color:#08122d;
}

.price{
font-weight:bold;
margin-top:10px;
}

button{
margin-top:10px;
padding:10px 20px;
border:none;
background:#57d2b3;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

</style>

</head>
<body>

<div class="route-box">

<input type="text" id="fromCity" placeholder="From">
<input type="text" id="toCity" placeholder="To">
<input type="date" id="journeyDate">

</div>

<button onclick="selectTransport('Bus')">🚌 Bus</button>

<button onclick="selectTransport('Train')">🚆 Train</button>

<button onclick="selectTransport('Flight')">✈ Flight</button>

<button onclick="selectTransport('Ship')">🚢 Ship</button>

<button onclick="selectTransport('Car')">🚗 Car</button>
